name: Deploy

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump level for the production release'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
  SITE_URL: ${{ github.ref == 'refs/heads/dev' && 'https://ozwellconsole.os.mieweb.org' || 'https://ozwellmanager.os.mieweb.org' }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be run from main"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump version, tag and push
        id: bump
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          npm version ${{ inputs.bump }} -m "Release v%s"
          git push origin HEAD:main --follow-tags
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          fetch-depth: 0

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag points to a commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
      url: ${{ github.ref == 'refs/heads/dev' && 'https://ozwellconsole.os.mieweb.org' || 'https://ozwellmanager.os.mieweb.org' }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ needs.build.outputs.sha }} to ${{ env.TARGET }}
        env:
          SHA: ${{ needs.build.outputs.sha }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '~/ozwell-manager' }}
          PM2_APP: ${{ vars.DEPLOY_PM2_APP || 'ozwell-manager' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$SHA" "$PM2_APP" <<'EOF'
          set -euo pipefail
          app_dir="${1/#\~/$HOME}"; sha="$2"; pm2_app="$3"
          cd "$app_dir"
          git fetch --tags --force origin
          git checkout --force --detach "$sha"
          npm ci
          npm run build
          pm2 restart "$pm2_app"
          pm2 save
          git log -1 --oneline
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null "$SITE_URL/" && { echo "OK: $SITE_URL"; exit 0; }
            sleep 3
          done
          echo "::error::Health check failed for $SITE_URL"; exit 1
